<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="setting">
        <label for="grid-size">
            Change grid (2–100):
        </label>
        <input type="range" id="grid-size" min="2" max="100" value="16">
        <p>size: <span id="size-count">16</span> </p>
        <button id="apply">Apply</button>
        <button id="custom-grid">Custom Grid Size</button>
        <label>Random color: <input type="checkbox" id="random-color"></label>
        <label>Progressive darkening: <input type="checkbox" id="shading-mode"></label>
        <button id="gridClear">Clear</button>
    </div>
    <div id="root"></div>
    <script src="./script.js"></script>
</body>

</html>
